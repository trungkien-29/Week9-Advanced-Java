name: Java CI with Maven

# 1. Kích hoạt (Trigger) khi có sự kiện push hoặc pull_request vào nhánh main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn từ GitHub về máy ảo Ubuntu
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      # Bước 3: Thực thi vòng đời Maven (chạy pha test)
      - name: Run Unit Tests
        run: mvn test

      # Bước 4: Thực thi pha package (đóng gói tệp .jar)
      - name: Build and Package with Maven
        run: mvn package -DskipTests=false

      # Bước 5: Triển khai upload-artifact để lưu giữ và xác minh tệp .jar
      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        if: always() # Luôn chạy nếu package thành công
        with:
          name: app-packages
          path: "**/target/*.jar"
          retention-days: 7